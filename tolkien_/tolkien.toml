
[project]

name = "tolkien"
description = "Tolkien provides a simple `Token` type to allow various tokenizers to conform to the same interface."
requires-python = ">=3.14"

dependencies = []

keywords = [
  "generator",
  "grammar",
  "lex",
  "lexer",
  "lexing",
  "regex",
  "regular expression",
  "token",
  "tokenization",
  "tokenize",
  "tokenizer",
  "tokenizing",
  "unicode",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
  "Typing :: Typed",
]
