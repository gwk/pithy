[project]
license = "CC0-1.0"
readme = "readme.md"
authors = [
  { name = "George King", email = "george@theorypractice.dev" },
]
dynamic = [
  "version",
]
name = "iotest"
description = "IOTest is a process/integration test harness that captures standard IO as the basis for test validation."
requires-python = ">=3.14"
dependencies = [
  "pithy",
]
keywords = [
  "io",
  "test",
  "testing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Issues = "https://github.com/gwk/pithy/issues"
Source = "https://github.com/gwk/pithy"
Documentation = "https://github.com/gwk/pithy/tree/main/iotest#readme"

[project.optional-dependencies]
dev = [
  "mypy >= 2.1.0",
  "pyflakes >= 3.4.0",
  "isort >= 8.0.1",
]

[project.scripts]
iotest = "iotest.bin.iotest:main"

[build-system]
requires = [
  "flit_core >= 3.12",
]
build-backend = "flit_core.buildapi"
