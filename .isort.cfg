[settings]
atomic=True
combine_as_imports=True
default_section=FIRSTPARTY
indent='  '
lines_after_imports=2
lines_between_sections=1
line_length=128
multi_line_output=HANGING_INDENT_WITH_PARENTHESES
order_by_type=False
# Explicit src_paths prevent the default of the checkout directory itself.
# With the default, a checkout named after an imported module (e.g. a worktree named `legs`) makes isort list
# the checkout's parent directory. If a sandbox denies that, isort skips the importing file and still exits 0.
src_paths=*_
use_parentheses=True
