[project]
license = "CC0-1.0"
authors = [
    { name = "George King", email = "george@theorypractice.dev" },
]
dynamic = [
    "version",
]
readme = "tolkien/readme.md"
name = "tolkien"
description = "Tolkien provides a simple `Token` type to allow various tokenizers to conform to the same interface."
requires-python = ">=3.14"
dependencies = []
keywords = [
    "generator",
    "grammar",
    "lex",
    "lexer",
    "lexing",
    "regex",
    "regular expression",
    "token",
    "tokenization",
    "tokenize",
    "tokenizer",
    "tokenizing",
    "unicode",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Typing :: Typed",
]

[project.urls]
Issues = "https://github.com/gwk/pithy/issues"
Source = "https://github.com/gwk/pithy"
Documentation = "https://github.com/gwk/pithy/tree/main/tolkien#readme"

[project.scripts]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "tolkien/**/*",
]
exclude = [
    "tolkien/**/__pycache__/**/*",
    "tolkien/project.toml",
]

[tool.hatch.version]
path = "tolkien/__about__.py"
