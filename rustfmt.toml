# Match our Python style rather than the rustfmt defaults of 4 spaces and 100 columns.
# rustfmt searches upward from each crate directory, so this applies to every crate in the repo,
# as does the `.cargo/config.toml` alongside it.
# `craft-py-rust-ext` generates code to match; keep its `-indent` argument in sync with `tab_spaces`.

max_width = 128
tab_spaces = 2
