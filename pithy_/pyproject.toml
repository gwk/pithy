[project]
license = "CC0-1.0"
readme = "readme.md"
authors = [
  { name = "George King", email = "george@theorypractice.dev" },
]
dynamic = [
  "version",
]
name = "pithy"
description = "Pithy is a collection of utility libraries for Python 3."
requires-python = ">=3.14"
dependencies = [
  "blake3 >= 1.0.8",
  "brotli >= 1.2.0",
  "cryptography >= 46.0.7",
  "docutils >= 0.22.3",
  "lxml >= 6.0.4",
  "msgpack >= 1.1.2",
  "msgpack-types >= 0.7.0",
  "mypy-extensions >= 1.1.0",
  "python-multipart >= 0.0.26",
  "pyyaml >= 6.0.3",
  "starlette >= 1.0.0",
  "types-lxml >= 2026.2.16",
  "types-PyYAML >= 6.0.12.20260408",
  "requests >= 2.33.1",
]
keywords = [
  "ansi",
  "chart",
  "console",
  "csv",
  "diff",
  "format",
  "graph",
  "graphviz",
  "html",
  "json",
  "lex",
  "lexer",
  "lexing",
  "parse",
  "parser",
  "parsing",
  "sqlite",
  "svg",
]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Issues = "https://github.com/gwk/pithy/issues"
Source = "https://github.com/gwk/pithy"
Documentation = "https://github.com/gwk/pithy/tree/main/pithy#readme"

[project.optional-dependencies]
dev = [
  "mypy >= 2.1.0",
  "pyflakes >= 3.4.0",
  "isort >= 8.0.1",
]

[project.scripts]

[build-system]
requires = [
  "flit_core >= 3.12",
]
build-backend = "flit_core.buildapi"
