[project]
license = "CC0-1.0"
readme = "readme.md"
authors = [
  { name = "George King", email = "george@theorypractice.dev" },
]
dynamic = [
  "version",
]
name = "pithy"
description = "Pithy is a collection of utility libraries for Python 3."
requires-python = ">=3.14"
dependencies = [
  "blake3 >= 1.0.9",
  "brotli >= 1.2.0",
  "cryptography >= 49.0.0",
  "docutils >= 0.23",
  "lxml >= 6.1.1",
  "msgpack >= 1.2.1",
  "multipart >= 1.3.1",
  "playwright >= 1.61",
  "pyyaml >= 6.0.3",
  "requests >= 2.34.2",
  "starlette >= 1.3.1",
  "tolkien",
  "typing_extensions >= 4.13", # TypeForm (PEP 747); drop once we require Python 3.15.
]
keywords = [
  "ansi",
  "chart",
  "console",
  "csv",
  "diff",
  "format",
  "graph",
  "graphviz",
  "html",
  "json",
  "lex",
  "lexer",
  "lexing",
  "parse",
  "parser",
  "parsing",
  "sqlite",
  "svg",
]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Issues = "https://github.com/gwk/pithy/issues"
Source = "https://github.com/gwk/pithy"
Documentation = "https://github.com/gwk/pithy/tree/main/pithy#readme"

[project.scripts]

[tool.uv.sources]
tolkien = { workspace = true }

[build-system]
requires = [
  "flit_core >= 3.12",
]
build-backend = "flit_core.buildapi"
