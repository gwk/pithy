<!doctype html>

<meta charset="utf-8">
<title>Checkbox inclusion regression tests</title>
<script src="/static/pithy/pithy.js"></script>
<script src="suite.js"></script>
<script defer src="/static/pithy/htmx/htmx4.js"></script>
<pre id="results">Running...</pre>
<div id="fixture"></div>
<script>
// All test requests are canceled before transmission.
runTestSuite(async check => {
  const fixture = document.querySelector('#fixture');
  const originalPrefix = htmx.config.prefix;
  const bool = '<input id="flag" name="flag" type="checkbox" data-pithy-checkbox="bool">';
  const set = '<div id="choices"><input name="tags" type="checkbox" value="a" data-pithy-checkbox="set">' +
    '<input name="tags" type="checkbox" value="b" data-pithy-checkbox="set"></div>';
  let captured;
  function intercept(event) {
    captured = [...event.detail.ctx.request.body.entries()];
    event.preventDefault();
  }
  document.body.addEventListener('htmx:config:request', intercept);
  async function checkRequest(label, html, expected, values) {
    fixture.innerHTML = html;
    captured = undefined;
    await htmx.ajax('POST', '/checkbox-test-never-send', {source: fixture.querySelector('button'), values});
    if (JSON.stringify(captured) !== JSON.stringify(expected)) {
      throw new Error(label + ': expected ' + JSON.stringify(expected) + '; received ' + JSON.stringify(captured));
    }
    check(true, label);
  }
  try {
    for (const attr of ['hx-include', 'data-hx-include']) {
      const button = '<button type="button" ' + attr + '="#flag">Test</button>';
      await checkRequest(attr + ' unchecked bool', bool + button, [['flag', 'false']]);
      await checkRequest(attr + ' checked bool', bool.replace('type=', 'checked type=') + button, [['flag', 'true']]);
      await checkRequest(attr + ' disabled bool', bool.replace('type=', 'disabled type=') + button, []);
      await checkRequest(attr + ' disabled fieldset', '<fieldset disabled>' + bool + '</fieldset>' + button, []);
      await checkRequest(attr + ' explicit value', bool + button, [['flag', 'override']], {flag: 'override'});
      await checkRequest(attr + ' hx-vals', bool + button.replace('type=', 'hx-vals=\'{"flag":"override"}\' type='),
        [['flag', 'override']]);
      const setButton = '<button type="button" ' + attr + '="#choices">Test</button>';
      await checkRequest(attr + ' empty set', set + setButton, [['tags', '\x00']]);
      await checkRequest(attr + ' selected set', set.replaceAll('type=', 'checked type=') + setButton,
        [['tags', 'a'], ['tags', 'b']]);
      await checkRequest(attr + ' inherited', bool + '<div ' + attr + ':inherited="#flag"><button>Test</button></div>',
        [['flag', 'false']]);
      await checkRequest(attr + ' inherited append', bool + set + '<div hx-include:inherited="#flag"><div ' +
        attr + ':inherited:append="#choices"><button>Test</button></div></div>', [['flag', 'false'], ['tags', '\x00']]);
    }
    await checkRequest('Mixed inherited and appended spellings', bool + set +
      '<div data-hx-include:inherited="#flag"><button hx-include:append="#choices">Test</button></div>',
      [['flag', 'false'], ['tags', '\x00']]);
    await checkRequest('Unprefixed attribute takes precedence', bool + set +
      '<button hx-include="#flag" data-hx-include="#choices">Test</button>', [['flag', 'false']]);
    await checkRequest('Direct alias overrides inherited attribute', bool + set +
      '<div hx-include:inherited="#choices"><button data-hx-include="#flag">Test</button></div>', [['flag', 'false']]);
    await checkRequest('Native checkbox remains native', bool.replace('data-pithy-checkbox="bool"', '') +
      '<button data-hx-include="#flag">Test</button>', []);
    htmx.config.prefix = 'custom-hx-';
    await checkRequest('Configured prefix', bool + '<button custom-hx-include="#flag">Test</button>', [['flag', 'false']]);
    htmx.config.prefix = '';
    await checkRequest('Prefix disabled', bool + '<button hx-include="#flag">Test</button>', [['flag', 'false']]);
  } finally {
    htmx.config.prefix = originalPrefix;
    document.body.removeEventListener('htmx:config:request', intercept);
    fixture.replaceChildren();
  }
});
</script>
