
[project]

name = "wu"
description = "Writeup is a document language that transforms to HTML."
requires-python = ">=3.14"

dependencies = [
  "pithy",
  "pygments >= 2.19.2",
  "types-pygments >= 2.19.0.20250809",
]

keywords = [
  "HTML",
  "hypertext",
  "language",
  "markdown",
  "markup",
  "template",
  "writeup",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Typing :: Typed",
]
