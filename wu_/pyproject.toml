[project]
license = "CC0-1.0"
readme = "readme.md"
authors = [
  { name = "George King", email = "george@theorypractice.dev" },
]
dynamic = [
  "version",
]
name = "wu"
description = "Writeup is a document language that transforms to HTML."
requires-python = ">=3.14"
dependencies = [
  "pithy",
  "pygments >= 2.19.2",
  "types-pygments >= 2.19.0.20250809",
]
keywords = [
  "HTML",
  "hypertext",
  "language",
  "markdown",
  "markup",
  "template",
  "writeup",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Typing :: Typed",
]

[project.urls]
Issues = "https://github.com/gwk/pithy/issues"
Source = "https://github.com/gwk/pithy"
Documentation = "https://github.com/gwk/pithy/tree/main/wu#readme"

[project.optional-dependencies]
dev = [
  "mypy >= 2.2.0",
  "pyflakes >= 3.4.0",
  "pyperf >= 2.10",
  "isort >= 8.0.1",
]

[project.scripts]
writeup = "wu.bin.writeup:main"

[build-system]
requires = [
  "flit_core >= 3.12",
]
build-backend = "flit_core.buildapi"
