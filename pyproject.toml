# Dedicated to the public domain under CC0: https://creativecommons.org/publicdomain/zero/1.0/.
# Virtual workspace root; each package under a `*_` directory is a workspace member.

[tool.uv]
exclude-newer = "14 days"

# Per-package cooldown exceptions.
[tool.uv.exclude-newer-package]
uvicorn = "2026-09-15T00:00:00Z"

[tool.uv.workspace]
members = [
  "crafts_",
  "iotest_",
  "legs_",
  "pithy_",
  "pyrrhus_",
  "taptools_",
  "tap_backblaze_",
  "tap_betterstack_",
  "tolkien_",
  "tomul_",
  "utest_",
  "wu_",
]

[dependency-groups]
dev = [
  "mypy >= 2.3.1",
  "pyflakes >= 3.4.0",
  "pyperf >= 2.10",
  "isort >= 8.0.1",
  "msgpack-types >= 0.8.0",
  "types-PyYAML >= 6.0.12.20260518",
  "types-docutils >= 0.23.0.20260827",
  "uvicorn >= 0.53", # Imported by pithy.logs.uvicorn and pithy.web; optional at runtime, required for typechecking.
  "watchfiles >= 1.2", # Imported by pithy.web.reload; optional at runtime, required for typechecking.
]
