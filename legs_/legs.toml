
[project]

name = "legs"
description = "Legs is a lexer generator."
requires-python = ">=3.14"

dependencies = [
  "pithy"
]

keywords = [
  "generator",
  "grammar",
  "lex",
  "lexer",
  "lexing",
  "regex",
  "regular expression",
  "token",
  "tokenization",
  "tokenize",
  "tokenizer",
  "tokenizing",
  "unicode",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]
