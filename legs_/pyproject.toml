[project]
license = "CC0-1.0"
readme = "readme.md"
authors = [
  { name = "George King", email = "george@theorypractice.dev" },
]
dynamic = [
  "version",
]
name = "legs"
description = "Legs is a lexer generator."
requires-python = ">=3.14"
dependencies = [
  "pithy",
]
keywords = [
  "generator",
  "grammar",
  "lex",
  "lexer",
  "lexing",
  "regex",
  "regular expression",
  "token",
  "tokenization",
  "tokenize",
  "tokenizer",
  "tokenizing",
  "unicode",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]

[project.urls]
Issues = "https://github.com/gwk/pithy/issues"
Source = "https://github.com/gwk/pithy"
Documentation = "https://github.com/gwk/pithy/tree/main/legs#readme"

[project.optional-dependencies]
dev = [
  "mypy >= 2.1.0",
  "pyflakes >= 3.4.0",
  "isort >= 8.0.1",
]

[project.scripts]
legs = "legs.bin.legs:main"

[build-system]
requires = [
  "flit_core >= 3.12",
]
build-backend = "flit_core.buildapi"
